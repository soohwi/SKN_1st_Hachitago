[project]
name = "hachitago"
version = "0.1.0"
description = "서울시 장애인콜택시 이용현황 분석 및 조회 시스템"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "dotenv>=0.9.9",
    "folium>=0.20.0",
    "mysql-connector-python>=9.7.0",
    "pymysql>=1.2.0",
    "streamlit>=1.60.0",
    "streamlit-folium>=0.27.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hachitago"]
